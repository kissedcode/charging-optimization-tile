name: Build and distribute
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'branding/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/package-apk.sh'
      - 'scripts/verify-branding.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-distribution
  cancel-in-progress: false
jobs:
  distribute:
    if: github.repository == 'kissedcode/charging-optimization-tile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: firebase-distribution
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require deployment configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in KEYSTORE TESTERS WIF SERVICE_ACCOUNT FIREBASE_APP_ID FIREBASE_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required deployment configuration: $name"
              exit 1
            fi
          done
      - name: Reject stale main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA" || {
            echo "::error::This run is not the current main commit; run the latest commit instead."
            exit 1
          }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Restore persistent debug signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/charging-debug.keystore"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/charging-debug.keystore" >> "$GITHUB_ENV"
      - name: Build optimized debug-signed APK
        run: |
          ./scripts/verify-branding.sh
          ./gradlew --no-daemon :app:lintInternal :app:testInternalUnitTest :app:assembleInternal
          ./scripts/package-apk.sh
      - name: Verify final APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose dist/*.apk
          "$BUILD_TOOLS/aapt" dump badging dist/*.apk
          "$BUILD_TOOLS/aapt" dump xmltree dist/*.apk AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          if grep -E 'android:(testOnly|debuggable).*0xffffffff' "$RUNNER_TEMP/manifest.txt"; then
            echo "::error::The distributed build must not be testOnly or debuggable"
            exit 1
          fi
          test -s dist/mapping.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: charging-tile-${{ github.run_number }}-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.1.0
      - name: Authenticate with Google (no JSON key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Reject duplicate or older release
        run: node scripts/check-release.mjs
      - name: Distribute APK
        env:
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          CI: 'true'
        run: |
          set -euo pipefail
          # Mask each address, not just the combined secret.
          IFS=',' read -ra addresses <<< "$FIREBASE_TESTERS"
          for address in "${addresses[@]}"; do
            echo "::add-mask::${address//[[:space:]]/}"
          done
          firebase appdistribution:distribute dist/*.apk \
            --app "$FIREBASE_APP_ID" --project "$FIREBASE_PROJECT_ID" \
            --testers "$FIREBASE_TESTERS" \
            --release-notes "80% / Off Quick Settings tile. Build $GITHUB_RUN_NUMBER, commit $GITHUB_SHA. Debug-signed and R8-optimized." \
            --non-interactive 2>&1 | sed -E '/Download the release binary|[?&]token=/d'
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/charging-debug.keystore" firebase-debug.log
